<!-- question 22 -->

<!DOCTYPE html>
<html>
<head>
    <title>Newsletter Widget</title>

    <style>
        body{
            font-family:Arial;
            background:#e8f4ff;
        }

        .widget{
            width:350px;
            margin:80px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
            text-align:center;
        }

        .input-box{
            position:relative;
            margin:25px 0;
        }

        .input-box input{
            width:100%;
            padding:12px 10px;
            border:1px solid #999;
            border-radius:5px;
            outline:none;
        }

        .input-box label{
            position:absolute;
            left:10px;
            top:12px;
            background:white;
            color:gray;
            padding:0 5px;
            transition:0.3s;
            pointer-events:none;
        }

        .input-box input:focus + label,
        .input-box input:valid + label{
            top:-10px;
            font-size:12px;
            color:#2196F3;
        }

        button{
            width:100%;
            padding:10px;
            background:#2196F3;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#1976D2;
        }
    </style>
</head>

<body>

<div class="widget">

    <h2>Newsletter</h2>
    <p>Subscribe for latest updates</p>

    <form>

        <div class="input-box">
            <input type="email" id="mail" required>
            <label for="mail">Enter Your Email</label>
        </div>

        <button type="submit">Subscribe</button>

    </form>

</div>

</body>
</html>
